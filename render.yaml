services:
  - type: web
    name: medusa-garderoba-backend
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: corepack enable && corepack prepare pnpm@10.11.1 --activate && pnpm install --frozen-lockfile && pnpm --filter @dtc/backend build
    startCommand: cd apps/backend && pnpm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: medusa-garderoba-db
          property: connectionString
      - key: STORE_CORS
        sync: false
      - key: ADMIN_CORS
        sync: false
      - key: AUTH_CORS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: REDIS_URL
        sync: false

databases:
  - name: medusa-garderoba-db
    plan: starter
    region: frankfurt
